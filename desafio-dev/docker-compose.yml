version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: lapes-postgres
    environment:
      POSTGRES_USER: lapes_user
      POSTGRES_PASSWORD: lapes_password
      POSTGRES_DB: lapes_ecommerce
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lapes-redis
    ports:
      - "6379:6379"

volumes:
  pgdata: